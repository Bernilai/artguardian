[databases]
artguardian = host=postgres port=5432 dbname=artguardian

[pgbouncer]
; Network settings
listen_addr = 0.0.0.0
listen_port = 6432

; Authentication settings
; Use auth_query to verify passwords against PostgreSQL (better than static userlist)
auth_type = scram-sha-256
auth_user = artguardian
auth_query = SELECT usename, passwd FROM pg_shadow WHERE usename=$1
; Fallback to userlist.txt if auth_query fails
auth_file = /etc/pgbouncer/userlist.txt

; Pool settings
pool_mode = transaction
max_client_conn = 1000
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3
max_db_connections = 0
max_user_connections = 0

; Connection settings
ignore_startup_parameters = extra_float_digits
; Server connection lifetime: how long a server connection can exist (default: 3600s)
; Increased to 7200s (2 hours) to give SQLAlchemy more time to recycle connections
server_lifetime = 7200
; Server idle timeout: close idle server connections after this time (default: 600s)
; Increased to 1800s (30 min) to prevent premature connection closure
server_idle_timeout = 1800

; Logging
logfile = /var/log/pgbouncer/pgbouncer.log
pidfile = /var/run/pgbouncer/pgbouncer.pid

; Admin settings
admin_users = artguardian
stats_users = artguardian

