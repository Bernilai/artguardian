name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint-test:
    name: Backend Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Run lint if available
        run: |
          if python -m pip show ruff > /dev/null 2>&1; then
            echo "ruff detected, running lint."
            python -m ruff check .
          elif python -m pip show flake8 > /dev/null 2>&1; then
            echo "flake8 detected, running lint."
            python -m flake8 .
          else
            echo "No ruff/flake8 found in dependencies, skipping lint."
          fi

      - name: Run pytest if tests exist
        run: |
          if [ -d "tests" ]; then
            echo "tests/ directory found, running pytest."
            python -m pytest
          else
            echo "No tests/ directory found, skipping pytest."
          fi

  frontend-lint-test:
    name: Frontend Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node20-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node20-

      - name: Install frontend dependencies
        run: npm ci

      - name: Run lint if script exists
        run: |
          if npm run | grep -qE "^[[:space:]]+lint$"; then
            echo "lint script found, running lint."
            npm run lint
          else
            echo "No lint script found in package.json, skipping lint."
          fi

      - name: Run frontend tests
        run: npm test -- --watchAll=false --passWithNoTests

  docker-build-validate:
    name: Docker Build & Compose Validate
    runs-on: ubuntu-latest
    needs:
      - backend-lint-test
      - frontend-lint-test
    env:
      POSTGRES_USER: ci_user
      POSTGRES_PASSWORD: ci_password
      POSTGRES_DB: ci_db
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
      DATABASES_USER: ci_user
      DATABASES_PASSWORD: ci_password
      MINIO_ROOT_USER: ci_minio_user
      MINIO_ROOT_PASSWORD: ci_minio_password
      PGADMIN_DEFAULT_EMAIL: ci@example.com
      PGADMIN_DEFAULT_PASSWORD: ci_pgadmin_password
      BACKEND_PORT: "8000"
      FRONTEND_PORT: "80"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t artguardian-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t artguardian-frontend:ci ./frontend

      - name: Create CI .env for compose env_file
        run: |
          cat > .env <<EOF
          POSTGRES_USER=${POSTGRES_USER}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          POSTGRES_DB=${POSTGRES_DB}
          POSTGRES_INITDB_ARGS=${POSTGRES_INITDB_ARGS}
          DATABASES_USER=${DATABASES_USER}
          DATABASES_PASSWORD=${DATABASES_PASSWORD}
          MINIO_ROOT_USER=${MINIO_ROOT_USER}
          MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
          PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
          PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
          SECRET_KEY=ci_secret_key_placeholder_32chars_min
          ALGORITHM=HS256
          ACCESS_TOKEN_EXPIRE_MINUTES=30
          REFRESH_TOKEN_EXPIRE_DAYS=7
          DATABASE_URL=postgresql+asyncpg://ci_user:ci_password@pgbouncer:6432/ci_db
          MINIO_ACCESS_KEY=ci_minio_access_key
          MINIO_SECRET_KEY=ci_minio_secret_key
          MINIO_ENDPOINT=minio:9000
          MINIO_BUCKET_NAME=ci-bucket
          MINIO_SECURE=false
          MINIO_REGION=us-east-1
          MINIO_PUBLIC_URL=http://localhost:9000
          CORS_ORIGINS=http://localhost:3000
          BACKEND_PORT=${BACKEND_PORT}
          FRONTEND_PORT=${FRONTEND_PORT}
          EOF

      - name: Validate docker-compose configuration
        run: docker compose config
