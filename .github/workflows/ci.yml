name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint-test:
    name: Backend Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Run ruff lint
        run: python -m ruff check .

      - name: Run pytest if tests exist
        run: |
          if [ -d "tests" ]; then
            echo "tests/ directory found, running pytest."
            python -m pytest || (exit_code=$?; if [ $exit_code -eq 5 ]; then echo "No tests collected, skipping."; exit 0; else exit $exit_code; fi)
          else
            echo "No tests/ directory found, skipping pytest."
          fi

  frontend-lint-test:
    name: Frontend Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node20-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node20-

      - name: Install frontend dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run frontend tests
        run: npm test -- --watchAll=false --passWithNoTests

  docker-build-validate:
    name: Docker Build & Compose Validate
    runs-on: ubuntu-latest
    needs:
      - backend-lint-test
      - frontend-lint-test
    env:
      POSTGRES_USER: ci_user
      POSTGRES_PASSWORD: ci_password
      POSTGRES_DB: ci_db
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
      DATABASES_USER: ci_user
      DATABASES_PASSWORD: ci_password
      MINIO_ROOT_USER: ci_minio_user
      MINIO_ROOT_PASSWORD: ci_minio_password
      PGADMIN_DEFAULT_EMAIL: ci@example.com
      PGADMIN_DEFAULT_PASSWORD: ci_pgadmin_password
      BACKEND_PORT: "8000"
      FRONTEND_PORT: "80"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t artguardian-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t artguardian-frontend:ci ./frontend

      - name: Create CI .env for compose env_file
        run: |
          cat > .env <<EOF
          POSTGRES_USER=${POSTGRES_USER}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          POSTGRES_DB=${POSTGRES_DB}
          POSTGRES_INITDB_ARGS=${POSTGRES_INITDB_ARGS}
          DATABASES_USER=${DATABASES_USER}
          DATABASES_PASSWORD=${DATABASES_PASSWORD}
          MINIO_ROOT_USER=${MINIO_ROOT_USER}
          MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
          PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
          PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
          SECRET_KEY=ci_secret_key_placeholder_32chars_min
          ALGORITHM=HS256
          ACCESS_TOKEN_EXPIRE_MINUTES=30
          REFRESH_TOKEN_EXPIRE_DAYS=7
          DATABASE_URL=postgresql+asyncpg://ci_user:ci_password@pgbouncer:6432/ci_db
          MINIO_ACCESS_KEY=ci_minio_access_key
          MINIO_SECRET_KEY=ci_minio_secret_key
          MINIO_ENDPOINT=minio:9000
          MINIO_BUCKET_NAME=ci-bucket
          MINIO_SECURE=false
          MINIO_REGION=us-east-1
          MINIO_PUBLIC_URL=http://localhost:9000
          CORS_ORIGINS=http://localhost,http://127.0.0.1
          BACKEND_PORT=${BACKEND_PORT}
          FRONTEND_PORT=${FRONTEND_PORT}
          EOF

      - name: Validate docker-compose configuration
        run: docker compose config

  deploy:
    name: Deploy (self-hosted)
    runs-on: [self-hosted, Windows, X64, artguardian]
    needs:
      - backend-lint-test
      - frontend-lint-test
      - docker-build-validate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env file
        shell: powershell
        run: |
          @"
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          POSTGRES_INITDB_ARGS=${{ secrets.POSTGRES_INITDB_ARGS }}
          DATABASES_USER=${{ secrets.DATABASES_USER }}
          DATABASES_PASSWORD=${{ secrets.DATABASES_PASSWORD }}
          MINIO_ROOT_USER=${{ secrets.MINIO_ROOT_USER }}
          MINIO_ROOT_PASSWORD=${{ secrets.MINIO_ROOT_PASSWORD }}
          PGADMIN_DEFAULT_EMAIL=${{ secrets.PGADMIN_DEFAULT_EMAIL }}
          PGADMIN_DEFAULT_PASSWORD=${{ secrets.PGADMIN_DEFAULT_PASSWORD }}
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          ALGORITHM=${{ secrets.ALGORITHM }}
          ACCESS_TOKEN_EXPIRE_MINUTES=${{ secrets.ACCESS_TOKEN_EXPIRE_MINUTES }}
          REFRESH_TOKEN_EXPIRE_DAYS=${{ secrets.REFRESH_TOKEN_EXPIRE_DAYS }}
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          MINIO_ACCESS_KEY=${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY=${{ secrets.MINIO_SECRET_KEY }}
          MINIO_ENDPOINT=${{ secrets.MINIO_ENDPOINT }}
          MINIO_BUCKET_NAME=${{ secrets.MINIO_BUCKET_NAME }}
          MINIO_SECURE=${{ secrets.MINIO_SECURE }}
          MINIO_REGION=${{ secrets.MINIO_REGION }}
          MINIO_PUBLIC_URL=${{ secrets.MINIO_PUBLIC_URL }}
          CORS_ORIGINS=${{ secrets.CORS_ORIGINS }}
          BACKEND_PORT=${{ secrets.BACKEND_PORT }}
          FRONTEND_PORT=${{ secrets.FRONTEND_PORT }}
          "@ | Set-Content -Path ".env" -Encoding ascii

      - name: Stop and remove existing containers
        shell: powershell
        run: |
          docker compose down --remove-orphans
          $names = @("minio", "artguardian-postgres", "artguardian-backend", "artguardian-frontend", "artguardian-pgadmin", "artguardian-pgbouncer")
          foreach ($name in $names) {
            $id = docker ps -aq --filter "name=^/${name}$"
            if ($id) {
              Write-Host "Removing container: $name ($id)"
              docker rm -f $id
            }
          }

      - name: Start services
        shell: powershell
        run: docker compose up -d --build

      - name: Wait for backend health
        shell: powershell
        run: |
          $retries = 10
          $delay = 10
          for ($i = 0; $i -lt $retries; $i++) {
            try {
              $response = Invoke-WebRequest -Uri "http://localhost:8000/health" -UseBasicParsing -TimeoutSec 5
              if ($response.StatusCode -eq 200) {
                Write-Host "Backend is healthy"
                exit 0
              }
            } catch {}
            Write-Host "Waiting for backend... attempt $($i+1)"
            Start-Sleep -Seconds $delay
          }
          Write-Host "Backend did not become healthy in time"
          exit 1
