services:
  postgres:
    image: postgres:16-alpine
    container_name: artguardian-postgres
    ports:
      - "5432:5432"  # Keep exposed for direct connections if needed
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Set locale to English to avoid encoding issues with error messages
      POSTGRES_INITDB_ARGS: ${POSTGRES_INITDB_ARGS}
      LC_ALL: en_US.UTF-8
      LANG: en_US.UTF-8
      # Force English for all messages
      POSTGRES_INITDB_LOCALE: en_US.UTF-8
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pgbouncer:
    image: pgbouncer/pgbouncer:latest
    container_name: artguardian-pgbouncer
    ports:
      - "6432:6432"  # PgBouncer default port
    volumes:
      # Mount userlist.txt for authentication (read-only is fine)
      - ./backend/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
      # Note: pgbouncer.ini is auto-generated from environment variables by the container
    environment:
      # Database connection (PgBouncer connects to PostgreSQL)
      DATABASES_HOST: postgres
      DATABASES_PORT: 5432
      DATABASES_USER: ${DATABASES_USER}
      DATABASES_PASSWORD: ${DATABASES_PASSWORD}
      DATABASES_DBNAME: ${POSTGRES_DB}
      # PgBouncer settings
      PGBOUNCER_LISTEN_ADDR: 0.0.0.0
      PGBOUNCER_LISTEN_PORT: 6432
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: 1000
      PGBOUNCER_DEFAULT_POOL_SIZE: 25
      PGBOUNCER_MIN_POOL_SIZE: 5
      PGBOUNCER_RESERVE_POOL_SIZE: 5
      PGBOUNCER_RESERVE_POOL_TIMEOUT: 3
      PGBOUNCER_MAX_DB_CONNECTIONS: 0
      PGBOUNCER_MAX_USER_CONNECTIONS: 0
      # Connection lifetime settings (to prevent premature connection closure)
      PGBOUNCER_SERVER_LIFETIME: 7200  # 2 hours (increased from default 3600s)
      PGBOUNCER_SERVER_IDLE_TIMEOUT: 1800  # 30 minutes (increased from default 600s)
      # Authentication - use auth_query to verify passwords against PostgreSQL
      PGBOUNCER_AUTH_TYPE: scram-sha-256
      PGBOUNCER_AUTH_USER: ${POSTGRES_USER}
      PGBOUNCER_AUTH_QUERY: SELECT usename, passwd FROM pg_shadow WHERE usename=$1
      # Fallback to userlist.txt
      PGBOUNCER_AUTH_FILE: /etc/pgbouncer/userlist.txt
      # Admin settings
      PGBOUNCER_ADMIN_USERS: ${POSTGRES_USER}
      PGBOUNCER_STATS_USERS: ${POSTGRES_USER}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 6432 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: artguardian-pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 80 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB}
      MINIO_ENDPOINT: minio:9000
    depends_on:
      pgbouncer:
        condition: service_started
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"

volumes:
  postgres_data:
  minio_data:
  pgadmin_data:
